<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Stable Interactive Heart</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Heart Math & Particles
    const particleCount = 10000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const basePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()); 

        const x = 16 * Math.pow(Math.sin(t), 3) * r;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
        const z = (Math.random() - 0.5) * 4 * (1 - r); 

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        basePositions[i * 3] = x;
        basePositions[i * 3 + 1] = y;
        basePositions[i * 3 + 2] = z;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
        color: 0xff3366,
        size: 0.15,
        transparent: true,
        opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // 3. Mouse Interaction & Hole State
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999); 
    let mousePoint = new THREE.Vector3();
    
    let hasInteracted = false;
    let holeMultiplier = 1.0; 
    const holeRadius = 6.0;

    window.addEventListener('mousemove', (event) => {
        hasInteracted = true; 
        
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        raycaster.ray.intersectPlane(planeZ, mousePoint);
    });

    // 4. Animation & Physics Loop
    function animate() {
        requestAnimationFrame(animate);

        if (hasInteracted && holeMultiplier > 0) {
            holeMultiplier += (0 - holeMultiplier) * 0.03; 
        }

        const posAttribute = geometry.attributes.position;
        
        for (let i = 0; i < particleCount; i++) {
            const ix = i * 3;
            const iy = i * 3 + 1;
            const iz = i * 3 + 2;

            let px = posAttribute.array[ix];
            let py = posAttribute.array[iy];
            let pz = posAttribute.array[iz];

            const bx = basePositions[ix];
            const by = basePositions[iy];
            const bz = basePositions[iz];

            // Target Position (Hole vs Solid)
            let targetX = bx;
            let targetY = by;
            let targetZ = bz;

            if (holeMultiplier > 0.001) {
                const distFromCenter = Math.sqrt(bx * bx + by * by);
                if (distFromCenter < holeRadius && distFromCenter > 0.1) {
                    const pushForce = (holeRadius - distFromCenter) / distFromCenter;
                    targetX += bx * pushForce * holeMultiplier;
                    targetY += by * pushForce * holeMultiplier;
                }
            }

            // Mouse Scatter Logic
            const dx = mousePoint.x - px;
            const dy = mousePoint.y - py;
            const distance = Math.sqrt(dx * dx + dy * dy);

            const interactionRadius = 6;
            if (hasInteracted && distance < interactionRadius) {
                const force = (interactionRadius - distance) / interactionRadius;
                px -= (dx / distance) * force * 0.6;
                py -= (dy / distance) * force * 0.6;
                pz += (Math.random() - 0.5) * force * 3; 
            }

            // Spring Physics
            px += (targetX - px) * 0.05;
            py += (targetY - py) * 0.05;
            pz += (targetZ - pz) * 0.05;

            posAttribute.array[ix] = px;
            posAttribute.array[iy] = py;
            posAttribute.array[iz] = pz;
        }

        posAttribute.needsUpdate = true;
        
        // Removed the rotation code here so the heart remains perfectly still!

        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
